<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22357f" id="metaTheme">
  <title>Pedidos Colombina</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/logo.svg" alt="Colombina" class="brand-logo">
      <h1 id="viewTitle">Pedido</h1>
    </div>
    <div class="row gap-s">
      <button id="invBadge" class="badge warn" data-go="mas" title="Estado del inventario">Sin inv.</button>
      <button class="icon-btn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <main>
    <!-- ================= NUEVO PEDIDO ================= -->
    <section id="view-pedido" class="view active">
      <div class="card client-card">
        <div class="row between">
          <div class="grow min0">
            <div class="muted small" id="clientStatus">Ubicando…</div>
            <div class="client-name" id="clientName">—</div>
            <div class="muted small truncate" id="clientInfo"></div>
          </div>
          <div class="row gap-xs">
            <button class="btn small ghost" id="btnLocate" title="Detectar ubicación">📍</button>
            <button class="btn small" id="btnPickClient">Cambiar</button>
          </div>
        </div>
        <div id="nearbyList" class="chips"></div>
        <div id="clientActions" class="row gap-s wrap"></div>
      </div>

      <div class="card">
        <input type="search" id="prodSearch" placeholder="🔍 Buscar código o producto…" autocomplete="off">
        <div id="prodResults" class="results"></div>
      </div>

      <div class="card">
        <h2>Productos <span class="muted" id="lineCount"></span></h2>
        <div id="orderLines" class="lines"></div>
        <textarea id="orderNotes" rows="2" placeholder="Observaciones…"></textarea>
      </div>

      <div class="fixed-actions">
        <button class="btn ok grow" id="btnFinish">✔ Guardar</button>
        <button class="btn warn" id="btnClearOrder">🧹 Limpiar</button>
      </div>
    </section>

    <!-- ================= HISTORIAL ================= -->
    <section id="view-historial" class="view">
      <div class="card">
        <input type="search" id="histSearch" placeholder="🔍 Buscar cliente o #…">
        <div class="small muted mt">Fechas:</div>
        <div class="grid-2 mt-xs">
          <input type="date" id="histFrom" title="Desde">
          <input type="date" id="histTo" title="Hasta">
        </div>
        <div class="row gap-xs wrap mt">
          <button class="btn small" id="btnHistToday">Hoy</button>
          <button class="btn small" id="btnHistAll">Todos</button>
          <button class="btn small" id="btnHistDown">Descargados</button>
          <button class="btn small" id="btnSelAll">Selec. todos</button>
          <button class="btn small primary grow" id="btnExportSel">⬇ Descargar</button>
        </div>
      </div>
      <div id="histList"></div>
    </section>

    <!-- ================= CLIENTES ================= -->
    <section id="view-clientes" class="view">
      <div class="card">
        <div class="row gap-s">
          <input type="search" id="cliSearch" placeholder="🔍 Buscar cliente…" class="grow">
          <button class="btn primary" id="btnNewClient">+ Nuevo</button>
        </div>
        <div class="grid-2 mt">
          <label class="btn small">📥 Importar<input type="file" id="cliImport" accept=".xlsx,.xls" hidden></label>
          <button class="btn small" id="btnCliExport">📤 Exportar</button>
        </div>
      </div>
      <div id="cliList"></div>
    </section>

    <!-- ================= INVENTARIO ================= -->
    <section id="view-inventario" class="view">
      <div class="card inv-card">
        <div class="row gap-s">
          <input type="search" id="invSearch" placeholder="🔍 Buscar producto…" class="grow">
          <select id="invFilter" style="width:auto">
            <option value="all">Todos</option>
            <option value="ref">⭐ Habituales</option>
            <option value="stock">Disponible</option>
          </select>
        </div>
        <div id="invList" class="inv-results"></div>
      </div>
    </section>

    <!-- ================= MÁS ================= -->
    <section id="view-mas" class="view">
      <div class="card">
        <h2>Inventario</h2>
        <div id="invSummary" class="small"></div>
        <label class="btn primary block mt">📂 Cargar inventario
          <input type="file" id="invFile" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
        </label>
      </div>
      <div class="card">
        <h2>Apariencia</h2>
        <div class="seg" id="themeSeg">
          <button data-theme="auto">Auto</button>
          <button data-theme="light">☀ Claro</button>
          <button data-theme="dark">🌙 Oscuro</button>
        </div>
      </div>
      <div class="card">
        <h2>Ubicación y stock</h2>
        <label class="field">Radio GPS (metros)
          <input type="number" id="setRadius" min="10" step="10">
        </label>
        <label class="row gap-s small"><input type="checkbox" id="setDeduct"> Descontar pedidos del día</label>
      </div>
      <div class="card">
        <h2>Respaldo</h2>
        <div class="grid-2">
          <button class="btn" id="btnBackup">💾 Guardar</button>
          <label class="btn">♻ Restaurar<input type="file" id="restoreFile" accept=".json" hidden></label>
        </div>
      </div>
      <div class="card">
        <div id="stats" class="small muted"></div>
        <button class="btn primary block mt" id="btnInstall" hidden>📲 Instalar app</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="pedido" class="active"><span>🛒</span>Pedido</button>
    <button data-view="historial"><span>📋</span>Pedidos</button>
    <button data-view="clientes"><span>👥</span>Clientes</button>
    <button data-view="inventario"><span>📦</span>Inventario</button>
    <button data-view="mas"><span>⚙</span>Más</button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="btn ghost small" id="modalClose">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
